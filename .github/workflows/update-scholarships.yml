name: Update Scholarships

on:
  schedule:
    - cron: '0 0,12 * * *'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-scholarships:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch scholarships
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python fetch.py

      - name: Commit updated data
        run: |
          git config user.name "scholarship-bot"
          git config user.email "scholarship-bot@users.noreply.github.com"

          git add data/scholarships.json

          if git diff --cached --quiet; then
            echo "No scholarship data changes."
          else
            git commit -m "Auto-update scholarships"
            git push
          fi
